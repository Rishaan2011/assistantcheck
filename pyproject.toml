[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "assistantcheck"
version = "0.1.0"
description = "Offline regression checks for structured personal-assistant decisions"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[project.scripts]
assistantcheck = "assistantcheck.__main__:main"

[tool.setuptools.packages.find]
include = ["assistantcheck*"]
